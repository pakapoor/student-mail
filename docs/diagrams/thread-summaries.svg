<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the console list is built</title><desc id="d">Writes queue the student in thread_dirty; the summaries are rebuilt per student into thread_summaries; LIST_MODE picks the old list, a shadow comparison or the stored list.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a8"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8a94a8"/></marker></defs>
<rect width="1000" height="610" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="608.5" rx="14" fill="none" stroke="#e3e7ef"/>
<text x="500" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="500" dy="0">How the console list is built (Step 32)</tspan></text>
<rect x="30" y="70" width="200" height="84" rx="10" fill="#f3f5f9" stroke="#8a94a8" stroke-width="1.5"/>
<text x="130.0" y="99.0" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="130.0" dy="0">Any write</tspan></text>
<text x="130.0" y="116.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="130.0" dy="0">the app, a script,</tspan><tspan x="130.0" dy="16.6">or manual SQL</tspan></text>
<rect x="280" y="70" width="200" height="84" rx="10" fill="#fff4dc" stroke="#a15c00" stroke-width="1.5"/>
<text x="380.0" y="99.0" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="380.0" dy="0">Database triggers</tspan></text>
<text x="380.0" y="116.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="380.0" dy="0">on messages, replies</tspan><tspan x="380.0" dy="16.6">and student columns</tspan></text>
<path d="M530 71 v82 a95.0 9 0 0 0 190 0 v-82" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<ellipse cx="625.0" cy="71" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="625.0" y="111.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="625.0" dy="0">thread_dirty</tspan></text>
<text x="625.0" y="129.78" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="625.0" dy="0">students to rebuild</tspan></text>
<rect x="770" y="70" width="200" height="84" rx="10" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="870.0" y="99.0" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="870.0" dy="0">Rebuild</tspan></text>
<text x="870.0" y="116.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="870.0" dy="0">before every list read</tspan><tspan x="870.0" dy="16.6">and every 2 s</tspan></text>
<path d="M230 112 L280 112" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M480 112 L530 112" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M720 112 L770 112" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770" y="210" width="200" height="96" rx="10" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="870.0" y="236.67999999999998" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="870.0" dy="0">buildSummaries()</tspan></text>
<text x="870.0" y="254.59999999999997" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="870.0" dy="0">the same grouping and</tspan><tspan x="870.0" dy="16.6">badge code as the old</tspan><tspan x="870.0" dy="16.6">list, one student at a time</tspan></text>
<path d="M530 217 v82 a95.0 9 0 0 0 190 0 v-82" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<ellipse cx="625.0" cy="217" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="625.0" y="257.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="625.0" dy="0">thread_summaries</tspan></text>
<text x="625.0" y="275.78000000000003" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="625.0" dy="0">one row per thread</tspan></text>
<path d="M870 154 L870 210" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M770 258 L720 258" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="214" width="440" height="96" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/>
<text x="250.0" y="242.6" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="250.0" dy="0">Kept honest</tspan></text>
<text x="250.0" y="260.52" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="250.0" dy="0">an hourly check rebuilds 100 random students</tspan><tspan x="250.0" dy="15.4">in memory and compares them with what is stored;</tspan><tspan x="250.0" dy="15.4">a difference is logged and the student is queued again</tspan></text>
<path d="M470 262 L530 262" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M625 208 L625 162" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="583.0" y="174.0" width="84" height="22" rx="5" fill="#ffffff" fill-opacity="0.94"/>
<text x="625" y="189" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="625" dy="0">queue again</tspan></text>
<rect x="30" y="350" width="940" height="224" rx="14" fill="none" stroke="#8a94a8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="46" y="374" font-size="13" text-anchor="start" font-weight="700" fill="#5b6478"><tspan x="46" dy="0">GET /api/threads : the LIST_MODE setting picks the source</tspan></text>
<path d="M625 308 L625 350" fill="none" stroke="#1f4fb8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640" y="337" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="640" dy="0">shadow and table read these rows</tspan></text>
<rect x="56" y="392" width="264" height="122" rx="10" fill="#f3f5f9" stroke="#8a94a8" stroke-width="1.5"/>
<text x="188.0" y="431.68" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="188.0" dy="0">legacy (the default)</tspan></text>
<text x="188.0" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="188.0" dy="0">reads every message of the</tspan><tspan x="188.0" dy="16.6">mailbox, groups the threads</tspan><tspan x="188.0" dy="16.6">in Node, then cuts 25 rows</tspan></text>
<rect x="368" y="392" width="264" height="122" rx="10" fill="#fff4dc" stroke="#a15c00" stroke-width="1.5"/>
<text x="500.0" y="431.68" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="500.0" dy="0">shadow</tspan></text>
<text x="500.0" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="500.0" dy="0">answers with the legacy list,</tspan><tspan x="500.0" dy="16.6">also reads the stored one and</tspan><tspan x="500.0" dy="16.6">logs every difference</tspan></text>
<rect x="680" y="392" width="264" height="122" rx="10" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="812.0" y="431.68" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="812.0" dy="0">table</tspan></text>
<text x="812.0" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="812.0" dy="0">one indexed query with LIMIT</tspan><tspan x="812.0" dy="16.6">and one grouped count;</tspan><tspan x="812.0" dy="16.6">any error falls back to legacy</tspan></text>
<text x="500" y="552" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="500" dy="0">Rollback is one setting (LIST_MODE=legacy) and a restart.</tspan></text>
</svg>
