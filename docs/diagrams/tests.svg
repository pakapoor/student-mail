<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the tests run</title><desc id="d">node --test starts one process per test file in parallel; each database test file gets its own throwaway PostgreSQL on its own port, deleted afterwards.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a8"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8a94a8"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="518.5" rx="14" fill="none" stroke="#e3e7ef"/>
<text x="500" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="500" dy="0">How the tests run</tspan></text>
<rect x="30" y="220" width="170" height="80" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/>
<text x="115.0" y="255.32" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="115.0" dy="0">npm run check</tspan></text>
<text x="115.0" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="115.0" dy="0">before every check-in</tspan></text>
<rect x="250" y="220" width="190" height="80" rx="10" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="345.0" y="247.0" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="345.0" dy="0">node --test</tspan></text>
<text x="345.0" y="264.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="345.0" dy="0">one process per test</tspan><tspan x="345.0" dy="16.6">file, in parallel</tspan></text>
<path d="M200 260 L250 260" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500" y="78" width="210" height="58" rx="10" fill="#f3f5f9" stroke="#8a94a8" stroke-width="1.5"/>
<text x="605.0" y="110.11999999999999" font-size="12" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="605.0" dy="0">threadSummaries.db.test</tspan></text>
<path d="M770 75 v66 a95.0 9 0 0 0 190 0 v-66" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<ellipse cx="865.0" cy="75" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="865.0" y="107.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="865.0" dy="0">own PostgreSQL</tspan></text>
<text x="865.0" y="125.78" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="865.0" dy="0">own folder, own port</tspan></text>
