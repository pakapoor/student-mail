<ellipse cx="865.0" cy="165" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="865.0" y="197.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="865.0" dy="0">own PostgreSQL</tspan></text>
<text x="865.0" y="215.78000000000003" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="865.0" dy="0">own folder, own port</tspan></text>
<path d="M710 197 L770 197" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M440 260 L470 260 L470 197 L500 197" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
