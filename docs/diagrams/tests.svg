<text x="605.0" y="290.12" font-size="12" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="605.0" dy="0">sync.db.test</tspan></text>
<path d="M770 255 v66 a95.0 9 0 0 0 190 0 v-66" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<ellipse cx="865.0" cy="255" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="865.0" y="287.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="865.0" dy="0">own PostgreSQL</tspan></text>
<text x="865.0" y="305.78000000000003" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="865.0" dy="0">own folder, own port</tspan></text>
<path d="M710 287 L770 287" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M440 260 L470 260 L470 287 L500 287" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500" y="348" width="210" height="58" rx="10" fill="#f3f5f9" stroke="#8a94a8" stroke-width="1.5"/>
<text x="605.0" y="380.12" font-size="12" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="605.0" dy="0">roster.db.test  …</tspan></text>
<path d="M770 345 v66 a95.0 9 0 0 0 190 0 v-66" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<ellipse cx="865.0" cy="345" rx="95.0" ry="9" fill="#e9effc" stroke="#1f4fb8" stroke-width="1.5"/>
<text x="865.0" y="377.86" font-size="14" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="865.0" dy="0">own PostgreSQL</tspan></text>
<text x="865.0" y="395.78000000000003" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="865.0" dy="0">own folder, own port</tspan></text>
<path d="M710 377 L770 377" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M440 260 L470 260 L470 377 L500 377" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500" y="438" width="210" height="58" rx="10" fill="#f3f5f9" stroke="#8a94a8" stroke-width="1.5"/>
<text x="605.0" y="470.12" font-size="12" text-anchor="middle" font-weight="700" fill="#16213a"><tspan x="605.0" dy="0">edugate.test  units.test  …</tspan></text>
<text x="865" y="470" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6478"><tspan x="865" dy="0">no database needed</tspan></text>
<path d="M440 260 L470 260 L470 467 L500 467" fill="none" stroke="#8a94a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M710 467 L770 467" fill="none" stroke="#8a94a8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="30" y="380" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="30" dy="0">Each database file resets its tables between its own tests;</tspan></text>
<text x="30" y="398" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="30" dy="0">nothing is shared between files, and the development and</tspan></text>
<text x="30" y="416" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="30" dy="0">production databases are never touched.</tspan></text>
<text x="30" y="446" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="30" dy="0">queryplans.db.test also runs EXPLAIN on the hottest</tspan></text>
<text x="30" y="464" font-size="12" text-anchor="start" font-weight="400" fill="#5b6478"><tspan x="30" dy="0">queries and fails if any table is still scanned.</tspan></text>
</svg>
